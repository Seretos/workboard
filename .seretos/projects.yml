version: 1

# Workboard project config.
#
# This file is used when the board is launched FROM this repo (dev /
# testing). In real operation the board is started outside any git repo,
# so config resolution falls through to the user-level
# `~/.seretos/projects.yml` instead (see backend/src/providers.py).
#
# The `workboard` entry below keeps write permissions so the
# agent-project-issues plugin can manage this repo's own issues/PRs when
# you work inside it.
#
# Every other entry mirrors the user-level project list purely so the
# board has real tickets to render during tests. Their `permissions:`
# blocks are intentionally OMITTED — an omitted block defaults to
# fully read-only (no issue/PR create/modify/merge), so test runs of the
# board can never create merge requests or mutate these repos.

projects:
  - id: workboard
    description: ""
    provider: github
    path: Seretos/workboard
    token_env: GITHUB_TOKEN
    permissions:
      issues:
        create: true
        modify: true
      pulls:
        create: true
        modify: true
        merge: false

  # --- read-only mirror of ~/.seretos/projects.yml (tickets-only) --------
  - id: agent-marketplace
    description: Central registry for agent plugins (MCPs, skills, commands, hooks)
    provider: github
    path: Seretos/agent-marketplace
    token_env: GITHUB_TOKEN

  - id: agent-autonomous-developer
    description: ""
    provider: github
    path: Seretos/agent-autonomous-developer
    token_env: GITHUB_TOKEN

  - id: agent-mcp-tester
